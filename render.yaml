services:
  # Backend Web Service running Flask API (Render FREE Tier)
  - type: web
    name: placement-readiness-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production

  # Frontend Static Site hosting React+Vite app (Render FREE Tier)
  - type: static_site
    name: placement-readiness-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: placement-readiness-backend
          property: host
    routes:
      # Redirect all path routes to index.html for React Router SPA compatibility
      - type: rewrite
        source: /*
        destination: /index.html
